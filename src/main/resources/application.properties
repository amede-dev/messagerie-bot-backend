spring.application.name=messagerie-bot

# --- Connexion Supabase (via variables d'environnement Render) ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 'update' en developpement uniquement. Une fois le projet stable,
# passer a une vraie gestion de migrations (Flyway/Liquibase) plutot
# que de laisser Hibernate modifier le schema automatiquement.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Render attribue le port dynamiquement via la variable PORT.
server.port=${PORT:8080}

# Cle utilisee pour signer les tokens JWT (via variable d'environnement Render).
app.jwt.secret=${JWT_SECRET:changez-cette-cle-secrete-avant-la-production-0123456789}
app.jwt.expiration-ms=86400000

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

app.upload-dir=uploads

# Pièces jointes : les messages vocaux peuvent dépasser la limite multipart
# par défaut de Spring Boot (1 Mo).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Les utilisateurs doivent être créés depuis l'application.
# Passer à true uniquement pour importer data/listebase.json.
app.annuaire-data.enabled=false

logging.level.mg.eni.reseauuniversitaire.messageriebot=DEBUG
